<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万象聚合API - AI图片生成工具 v1.2</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --card: #f1f5f9;
            --accent: #0ea5e9;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --panel: #111827;
            --card: #1f2937;
            --accent: #22d3ee;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --border: #1e293b;
            --danger: #ef4444;
            --success: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.08), transparent 32%),
                radial-gradient(circle at 82% 6%, rgba(147, 197, 253, 0.08), transparent 28%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-text {
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.sub {
            margin: 0 0 14px;
            color: var(--muted);
        }

        label {
            display: block;
            margin: 10px 0 6px;
            color: var(--muted);
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
        }

        select {
            height: 42px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .config-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }

        .config-row > * {
            flex: 1;
            min-width: 200px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 15px;
            cursor: pointer;
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: #0b1220;
            font-weight: 700;
            transition: transform 0.08s ease, box-shadow 0.12s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.35);
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--card);
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.05);
        }

        .upload-area .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .thumb {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }

        .thumb img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .thumb button {
            position: absolute;
            top: 6px;
            right: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #1e293b;
            border-radius: 8px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] .thumb button {
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
        }

        .model-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .model-option {
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: var(--card);
        }

        .model-option:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.05);
        }

        .model-option.active {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.1);
            font-weight: bold;
        }

        .model-option .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .model-option .name {
            font-size: 13px;
            color: var(--text);
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card img {
            width: 100%;
            border-radius: 10px;
            cursor: zoom-in;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .result-card img:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(34, 211, 238, 0.2);
        }

        .result-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mini-btn:hover {
            background: var(--border);
        }

        .mini-btn.primary {
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: #0b1220;
            border: none;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .history-item:hover {
            background: var(--border);
            transform: translateY(-2px);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            animation: fadeIn 0.2s ease;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.25s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.85);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .lightbox .close-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
        }

        .lightbox .close-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .Toastify {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--panel);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--accent);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.success {
            border-left-color: var(--success);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .status {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            min-height: 20px;
        }

        .status.generating {
            color: #ef4444;
            font-size: 18px;
            font-weight: bold;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--danger);
        }

        .warning {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .config-row {
                flex-direction: column;
            }
            
            .model-selector {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="app">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h1 style="margin: 0;"><span style="font-size: 28px; line-height: 1;">🎨</span><span class="title-text">万象聚合API - AI图片生成工具 v1.2</span></h1>
                <button class="theme-toggle" onclick="toggleTheme()" title="切换主题" style="background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 20px;">
                    🌙
                </button>
            </div>
            <p class="sub">基于 Gemini 3.1 Flash & Gemini 3 Pro & GPT-Image 的高质量图片生成</p>

            <div class="config-row">
                <div style="flex: 2;">
                    <label for="apiKey">API密钥 <a href="https://api.aimiddle.vip" target="_blank" style="color: #0ea5e9; text-decoration: none; font-size: 13px;">（获取秘钥）</a></label>
                    <input type="text" id="apiKey" placeholder="请输入万象聚合API密钥" />
                </div>
                <div style="flex: 2;">
                    <label for="baseUrl">Base URL</label>
                    <input type="text" id="baseUrl" value="https://api.aimiddle.vip/v1" />
                </div>
                <div style="flex: 0 0 auto; padding-top: 22px;">
                    <button class="btn" onclick="saveSettings()">💾 保存设置</button>
                </div>
            </div>

            <label for="prompt">提示词（必填）</label>
            <textarea id="prompt" placeholder="描述您想要生成的图片内容..."></textarea>

            <label>上传参考图（最多7张，可拖拽/粘贴）</label>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="icon">🖼️</div>
                <p>点击或拖拽上传参考图</p>
                <p style="font-size: 12px; color: var(--muted);">支持PNG/JPEG</p>
            </div>
            <input type="file" id="fileInput" multiple accept="image/png,image/jpeg" style="display: none;" onchange="handleFileUpload(event)" />
            <div class="image-preview" id="imagePreview"></div>

            <div style="margin-top: 20px;">
                <label>模型选择</label>
                <div class="model-selector">
                    <div class="model-option active" data-model="gemini-3-pro-image-preview" onclick="selectModel(this)">
                        <div class="icon">🍌</div>
                        <div class="name">Banana Pro<br/>高质量生成</div>
                    </div>
                    <div class="model-option" data-model="gemini-3.1-flash-image-preview" onclick="selectModel(this)">
                        <div class="icon">⚡</div>
                        <div class="name">Banana 2<br/>快速生成</div>
                    </div>
                    <div class="model-option" data-model="gpt-image-2-all" onclick="selectModel(this)">
                        <div class="icon">🎨</div>
                        <div class="name">gpt-image-2-all<br/>逆向渠道</div>
                    </div>
                    <div class="model-option" data-model="gpt-image-2" onclick="selectModel(this)">
                        <div class="icon">🖼️</div>
                        <div class="name">gpt-image-2<br/>官方渠道</div>
                    </div>
                </div>
            </div>

            <div class="config-row" style="margin-top: 20px;">
                <div id="aspectRatioContainer">
                    <label for="aspectRatio">图片比例/尺寸</label>
                    <select id="aspectRatio">
                        <option value="auto" selected>自动</option>
                    </select>
                </div>
                <div id="qualityContainer">
                    <label for="quality">质量/清晰度</label>
                    <select id="quality">
                        <option value="auto" selected>auto</option>
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                    </select>
                </div>
                <div id="formatContainer">
                    <label for="format">图片格式（GPT模型）</label>
                    <select id="format">
                        <option value="png" selected>png</option>
                        <option value="jpeg">jpeg</option>
                        <option value="webp">webp</option>
                    </select>
                </div>
                <div>
                    <label for="imageCount">生成张数</label>
                    <input type="number" id="imageCount" value="1" min="1" max="10" />
                </div>
            </div>

            <div class="status" id="status">待发送...</div>

            <button class="btn" onclick="generateImage()" style="width: 100%; margin-top: 15px; padding: 15px; font-size: 16px;">
                🚀 发送请求
            </button>
        </div>

        <div class="panel">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 18px;">✨ 返回结果</h2>
                <span class="muted" id="resultCount">0 条</span>
                <button class="mini-btn" onclick="clearResults()" style="margin-left: auto;">清空结果</button>
            </div>
            <div id="resultArea">
                <p style="text-align: center; color: var(--muted); padding: 40px;">生成的图片将在这里显示...</p>
            </div>
        </div>

        <div class="panel">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 18px;">📜 历史记录</h2>
                <span class="muted" id="historyCount">0 条</span>
                <button class="mini-btn" onclick="clearHistory()" style="margin-left: auto;">清空历史</button>
            </div>
            <div id="historyList">
                <p style="text-align: center; color: var(--muted); padding: 40px;">暂无历史记录</p>
            </div>
        </div>

        <div class="warning">
            ⚠️ 警告：服务器每12小时清理图片，请及时下载生成的图片！
        </div>
    </div>

    <!-- 图片放大模态框 -->
    <div class="lightbox" id="lightbox">
        <button class="close-btn" onclick="closeLightbox()">✕</button>
        <img src="" alt="放大图片" id="lightboxImg" />
    </div>

    <script>
        let selectedModel = 'gemini-3-pro-image-preview';
        let uploadedImages = [];
        let uploadedFiles = [];
        let apiKey = localStorage.getItem('vectorengine_api_key') || '';
        let baseUrl = localStorage.getItem('vectorengine_base_url') || 'https://api.aimiddle.vip/v1';
        let generationTimer = null;
        let generationStartTime = null;

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            body.setAttribute('data-theme', newTheme);
            localStorage.setItem('vectorengine_theme', newTheme);
            
            const btn = document.querySelector('.theme-toggle');
            btn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('vectorengine_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
            }
        }

        if (apiKey) {
            document.getElementById('apiKey').value = apiKey;
        }
        document.getElementById('baseUrl').value = baseUrl;
        initTheme();
        initDragAndDrop();
        updateModelOptions();

        function selectModel(element) {
            document.querySelectorAll('.model-option').forEach(opt => opt.classList.remove('active'));
            element.classList.add('active');
            selectedModel = element.dataset.model;
            updateModelOptions();
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKey').value.trim();
            baseUrl = document.getElementById('baseUrl').value.trim();

            if (!apiKey) {
                showToast('请输入API密钥', 'error');
                return;
            }

            localStorage.setItem('vectorengine_api_key', apiKey);
            localStorage.setItem('vectorengine_base_url', baseUrl);
            showToast('设置已保存', 'success');
        }

        function handleFileUpload(event) {
            const files = Array.from(event.target.files);
            
            if (uploadedImages.length + files.length > 7) {
                showToast('最多只能上传7张参考图', 'error');
                return;
            }

            files.forEach(file => {
                uploadedFiles.push(file);
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImages.push(e.target.result);
                    updateImagePreview();
                };
                reader.readAsDataURL(file);
            });
        }

        function updateImagePreview() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            uploadedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'thumb';
                div.innerHTML = `
                    <img src="${img}" alt="参考图${index + 1}" />
                    <button onclick="removeImage(${index})">✕</button>
                `;
                preview.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            uploadedFiles.splice(index, 1);
            updateImagePreview();
        }

        function initDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');
            
            uploadArea.addEventListener('dragenter', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = 'var(--accent)';
                uploadArea.style.background = 'rgba(34, 211, 238, 0.1)';
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = 'var(--accent)';
                uploadArea.style.background = 'rgba(34, 211, 238, 0.1)';
            });

            uploadArea.addEventListener('dragleave', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = 'var(--border)';
                uploadArea.style.background = 'var(--card)';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.style.borderColor = 'var(--border)';
                uploadArea.style.background = 'var(--card)';
                
                const files = Array.from(e.dataTransfer.files).filter(file => 
                    file.type === 'image/png' || file.type === 'image/jpeg'
                );
                
                if (files.length === 0) {
                    showToast('请拖入PNG或JPEG图片', 'error');
                    return;
                }

                if (uploadedImages.length + files.length > 7) {
                    showToast('最多只能上传7张参考图', 'error');
                    return;
                }

                files.forEach(file => {
                    uploadedFiles.push(file);
                    
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        uploadedImages.push(e.target.result);
                        updateImagePreview();
                    };
                    reader.readAsDataURL(file);
                });

                showToast(`已添加 ${files.length} 张图片`, 'success');
            });
        }

        function updateModelOptions() {
            const aspectRatioContainer = document.getElementById('aspectRatioContainer');
            const aspectRatioSelect = document.getElementById('aspectRatio');
            const qualityContainer = document.getElementById('qualityContainer');
            const qualitySelect = document.getElementById('quality');
            const formatContainer = document.getElementById('formatContainer');

            if (selectedModel === 'gemini-3-pro-image-preview' || selectedModel === 'gemini-3.1-flash-image-preview') {
                aspectRatioContainer.style.display = 'block';
                aspectRatioSelect.innerHTML = `
                    <option value="auto" selected>自动</option>
                    <option value="1:1">1:1</option>
                    <option value="3:4">3:4</option>
                    <option value="4:3">4:3</option>
                    <option value="16:9">16:9</option>
                    <option value="9:16">9:16</option>
                    <option value="2:3">2:3</option>
                    <option value="3:2">3:2</option>
                    <option value="4:5">4:5</option>
                    <option value="5:4">5:4</option>
                    <option value="21:9">21:9</option>
                `;

                qualityContainer.style.display = 'block';
                // 修改quality选项为Gemini API支持的imageSize值，默认4K
                qualitySelect.innerHTML = `
                    <option value="auto">自动 (映射为4K)</option>
                    <option value="0.5K">0.5K (低质量)</option>
                    <option value="1K">1K (标准)</option>
                    <option value="2K">2K (高清)</option>
                    <option value="4K" selected>4K (超高清)</option>
                `;

                formatContainer.style.display = 'none';
            } else {
                aspectRatioContainer.style.display = 'block';
                aspectRatioSelect.innerHTML = `
                    <option value="auto" selected>自动</option>
                    <option value="1024x1024">1024x1024 正方形</option>
                    <option value="1536x1024">1536x1024 横版</option>
                    <option value="1024x1536">1024x1536 竖版</option>
                    <option value="2048x2048">2048x2048 2K正方形</option>
                    <option value="2048x1152">2048x1152 2K横版</option>
                    <option value="3840x2160">3840x2160 4K横版</option>
                    <option value="2160x3840">2160x3840 4K竖版</option>
                `;

                qualityContainer.style.display = 'block';
                qualitySelect.innerHTML = `
                    <option value="auto">auto</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high" selected>high</option>
                `;

                formatContainer.style.display = 'block';
            }
        }

        function startGenerationTimer() {
            generationStartTime = Date.now();
            const status = document.getElementById('status');
            status.classList.add('generating');
            
            generationTimer = setInterval(() => {
                const elapsed = Math.floor((Date.now() - generationStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
                status.textContent = `生成中... 已用时：${timeStr}`;
            }, 1000);
        }

        function stopGenerationTimer() {
            if (generationTimer) {
                clearInterval(generationTimer);
                generationTimer = null;
            }
            const status = document.getElementById('status');
            status.classList.remove('generating');
        }

        // 将quality值映射为Gemini API的imageSize
        function mapQualityToImageSize(quality) {
            const mapping = {
                'auto': '4K',  // 默认改为4K
                '0.5K': '0.5K',
                '1K': '1K',
                '2K': '2K',
                '4K': '4K'
            };
            return mapping[quality] || '4K';
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            
            if (!apiKey) {
                showToast('请先设置API密钥', 'error');
                return;
            }

            if (!prompt) {
                showToast('请输入提示词', 'error');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            const status = document.getElementById('status');
            const count = parseInt(document.getElementById('imageCount').value) || 1;

            resultArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在生成图片，请稍候...</p>
                </div>
            `;
            status.textContent = '生成中...';
            status.className = 'status';

            startGenerationTimer();

            try {
                const allImages = [];

                for (let i = 0; i < count; i++) {
                    status.textContent = `正在生成第 ${i + 1}/${count} 张...`;
                    
                    let requestUrl = '';
                    let requestBody = null;
                    let useFormData = false;
                    let isGeminiNative = false;
                    
                    if (selectedModel === 'gpt-image-2' || selectedModel === 'gpt-image-2-all') {
                        // GPT模型使用OpenAI格式
                        const size = document.getElementById('aspectRatio').value;
                        const quality = document.getElementById('quality').value;
                        const format = document.getElementById('format').value;

                        if (uploadedImages.length > 0 && (selectedModel === 'gpt-image-2' || selectedModel === 'gpt-image-2-all')) {
                            // 使用 edits 端点（支持参考图）
                            requestUrl = `${baseUrl}/images/edits`;
                            useFormData = true;
                            
                            const formData = new FormData();
                            formData.append('model', selectedModel);
                            formData.append('prompt', prompt);
                            formData.append('n', '1');
                            
                            if (size !== 'auto') {
                                formData.append('size', size);
                            }
                            
                            if (quality !== 'auto') {
                                formData.append('quality', quality);
                            }
                            
                            // edits 端点不支持 format 参数
                            
                            uploadedFiles.forEach((file, index) => {
                                formData.append('image', file, `image${index}.png`);
                            });
                            
                            requestBody = formData;
                        } else {
                            // 使用 generations 端点（不支持参考图）
                            requestUrl = `${baseUrl}/images/generations`;
                            useFormData = false;
                            
                            requestBody = {
                                model: selectedModel,
                                prompt: prompt,
                                n: 1
                            };
                            
                            if (size !== 'auto') {
                                requestBody.size = size;
                            }
                            
                            if (quality !== 'auto') {
                                requestBody.quality = quality;
                            }
                            
                            // format 参数只在 generations 端点使用
                            requestBody.format = format;
                        }
                    } else {
                        // Gemini模型使用原生Gemini API格式
                        isGeminiNative = true;
                        // 构建正确的v1beta端点（移除baseUrl末尾的/v1，避免路径重复）
                        const baseUrlClean = baseUrl.replace(/\/v1$/, '');
                        requestUrl = `${baseUrlClean}/v1beta/models/${selectedModel}:generateContent`;
                        
                        const aspectRatio = document.getElementById('aspectRatio').value;
                        const quality = document.getElementById('quality').value;
                        const imageSize = mapQualityToImageSize(quality);
                        
                        // 构建contents数组
                        const parts = [];
                        
                        // 添加提示词
                        parts.push({
                            text: prompt
                        });
                        
                        // 添加参考图
                        if (uploadedImages.length > 0) {
                            uploadedImages.forEach(imgData => {
                                // 从base64数据中提取纯base64部分
                                const base64Data = imgData.includes('base64,') 
                                    ? imgData.split('base64,')[1] 
                                    : imgData;
                                
                                // 判断mime_type
                                const mimeType = imgData.includes('image/png') ? 'image/png' : 'image/jpeg';
                                
                                parts.push({
                                    inline_data: {
                                        mime_type: mimeType,
                                        data: base64Data
                                    }
                                });
                            });
                        }
                        
                        // 构建请求体
                        requestBody = {
                            contents: [
                                {
                                    role: 'user',
                                    parts: parts
                                }
                            ],
                            generationConfig: {
                                responseModalities: ['IMAGE']
                            }
                        };
                        
                        // 添加imageConfig（如果不是自动）
                        if (aspectRatio !== 'auto' || imageSize !== '1K') {
                            requestBody.generationConfig.imageConfig = {};
                            
                            if (aspectRatio !== 'auto') {
                                requestBody.generationConfig.imageConfig.aspectRatio = aspectRatio;
                            }
                            
                            if (imageSize !== '1K') {
                                requestBody.generationConfig.imageConfig.imageSize = imageSize;
                            }
                        }
                    }

                    let response;
                    
                    if (useFormData) {
                        const headers = new Headers();
                        headers.append('Authorization', `Bearer ${apiKey}`);
                        headers.append('Accept', 'application/json');

                        response = await fetch(requestUrl, {
                            method: 'POST',
                            headers: headers,
                            body: requestBody
                        });
                    } else if (isGeminiNative) {
                        // Gemini原生API格式
                        const headers = {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'Accept': 'application/json'
                        };

                        response = await fetch(requestUrl, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(requestBody)
                        });
                    } else {
                        // OpenAI格式（GPT模型）
                        const headers = {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'Accept': 'application/json'
                        };

                        response = await fetch(requestUrl, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(requestBody)
                        });
                    }

                    if (!response.ok) {
                        const error = await response.json();
                        throw new Error(error.error?.message || `HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    
                    let images = [];

                    if (isGeminiNative) {
                        // 解析Gemini原生API响应
                        if (data.candidates && data.candidates.length > 0) {
                            const candidate = data.candidates[0];
                            if (candidate.content && candidate.content.parts) {
                                candidate.content.parts.forEach(part => {
                                    if (part.inlineData && part.inlineData.data) {
                                        const mimeType = part.inlineData.mimeType || 'image/png';
                                        images.push(`data:${mimeType};base64,${part.inlineData.data}`);
                                    }
                                });
                            }
                        }
                    } else if (selectedModel === 'gpt-image-2' || selectedModel === 'gpt-image-2-all') {
                        // 解析GPT模型响应
                        if (data.data && data.data.length > 0) {
                            data.data.forEach(item => {
                                if (item.b64_json) {
                                    images.push(`data:image/png;base64,${item.b64_json}`);
                                } else if (item.url) {
                                    images.push(item.url);
                                }
                            });
                        }
                    } else {
                        // 解析OpenAI格式响应（旧版Gemini通过OpenAI代理）
                        const message = data.choices[0].message;
                        
                        if (message.content) {
                            const markdownRegex = /!\[([^\]]*)\]\(([^)]+)\)/g;
                            let match;
                            while ((match = markdownRegex.exec(message.content)) !== null) {
                                images.push(match[2]);
                            }

                            if (images.length === 0 && message.content.includes('base64')) {
                                const base64Regex = /data:image\/[^;]+;base64,([^)]+)/g;
                                while ((match = base64Regex.exec(message.content)) !== null) {
                                    images.push(match[0]);
                                }
                            }
                        }

                        if (images.length === 0 && message.tool_calls) {
                            message.tool_calls.forEach(toolCall => {
                                if (toolCall.function?.arguments) {
                                    try {
                                        const args = JSON.parse(toolCall.function.arguments);
                                        if (args.image) {
                                            images.push(args.image);
                                        }
                                    } catch (e) {}
                                }
                            });
                        }
                    }

                    if (images.length === 0) {
                        throw new Error('未找到生成的图片');
                    }

                    allImages.push(...images);
                }

                if (allImages.length === 0) {
                    throw new Error('未找到生成的图片');
                }

                stopGenerationTimer();

                displayResults(allImages);
                addToHistory(prompt, allImages);
                
                const elapsed = Math.floor((Date.now() - generationStartTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                const timeStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;

                status.textContent = `生成成功！共 ${allImages.length} 张图片，用时 ${timeStr}`;
                status.className = 'status success';
                showToast(`成功生成 ${allImages.length} 张图片`, 'success');

            } catch (error) {
                stopGenerationTimer();

                resultArea.innerHTML = `<div class="warning">生成失败：${error.message}</div>`;
                status.textContent = '生成失败：' + error.message;
                status.className = 'status error';
                showToast('生成失败：' + error.message, 'error');
            }
        }

        function displayResults(images) {
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '';
            
            const grid = document.createElement('div');
            grid.className = 'result-grid';

            images.forEach((img, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <img src="${img}" alt="生成的图片${index + 1}" onclick="openLightbox('${img}')" />
                    <div class="actions">
                        <button class="mini-btn primary" onclick="downloadImage('${img}', ${index})">⬇️ 下载</button>
                        <button class="mini-btn" onclick="copyImageUrl('${img}')">📋 复制链接</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            resultArea.appendChild(grid);
            document.getElementById('resultCount').textContent = `${images.length} 条`;
        }

        function downloadImage(url, index) {
            const a = document.createElement('a');
            a.href = url;
            a.download = `generated_image_${Date.now()}_${index}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('开始下载图片...', 'success');
        }

        function copyImageUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('链接已复制到剪贴板', 'success');
            });
        }

        function openLightbox(url) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = url;
            lightbox.classList.add('show');
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('show');
        }

        function addToHistory(prompt, images) {
            const history = JSON.parse(localStorage.getItem('generation_history') || '[]');
            history.unshift({
                prompt: prompt,
                model: selectedModel,
                imageCount: images.length,
                images: images,
                timestamp: Date.now()
            });

            if (history.length > 10) {
                history.pop();
            }

            try {
                localStorage.setItem('generation_history', JSON.stringify(history));
                updateHistoryList();
            } catch (e) {
                localStorage.removeItem('generation_history');
                updateHistoryList();
                showToast('历史记录已清空（存储配额超限）', 'error');
            }
        }

        function updateHistoryList() {
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('generation_history') || '[]');
            } catch (e) {
                localStorage.removeItem('generation_history');
                history = [];
            }

            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 40px;">暂无历史记录</p>';
                document.getElementById('historyCount').textContent = '0 条';
                return;
            }

            historyList.innerHTML = '';
            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.dataset.index = index;

                let imagesHtml = '';
                if (item.images && item.images.length > 0) {
                    imagesHtml = '<div style="display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;">';
                    item.images.forEach((img, imgIndex) => {
                        imagesHtml += `<img src="${img}" alt="历史图片${imgIndex + 1}" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--border);" data-history-index="${index}" data-img-index="${imgIndex}" />`;
                    });
                    imagesHtml += '</div>';
                }

                // 显示完整提示词，不使用 substring 截断
                div.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 5px; color: var(--text); word-break: break-word;">${item.prompt}</div>
                    <div style="font-size: 12px; color: var(--muted);">
                        模型：${item.model} |
                        图片数：${item.imageCount || 0} |
                        时间：${new Date(item.timestamp).toLocaleString()}
                    </div>
                    ${imagesHtml}
                `;
                historyList.appendChild(div);
            });

            document.getElementById('historyCount').textContent = `${history.length} 条`;

            // 给历史图片绑定点击事件（事件委托）
            historyList.querySelectorAll('img[data-history-index]').forEach(img => {
                img.addEventListener('click', function() {
                    openLightbox(this.src);
                });
            });
        }

        function clearHistory() {
            if (confirm('确定要清空历史记录吗？')) {
                localStorage.removeItem('generation_history');
                updateHistoryList();
                showToast('历史记录已清空', 'success');
            }
        }

        function clearResults() {
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 40px;">生成的图片将在这里显示...</p>';
            document.getElementById('resultCount').textContent = '0 条';
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + (type || '');
            toast.textContent = message;
            
            let container = document.querySelector('.Toastify');
            if (!container) {
                container = document.createElement('div');
                container.className = 'Toastify';
                document.body.appendChild(container);
            }
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        updateHistoryList();
    </script>
</body>
</html>
